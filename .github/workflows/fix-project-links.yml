name: Fix project links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add missing GitHub links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text()

          # Spotify: keep the case study and add the public code repository.
          spotify_anchor = '<a class="plink primary" href="predicting-spotify-skips.pdf" target="_blank" rel="noreferrer">Read case study ↗</a>'
          spotify_code = '<a class="plink" href="https://github.com/pedrohgp02/spotify-skip-prediction" target="_blank" rel="noreferrer">View code ↗</a>'
          if spotify_code not in text:
              text = text.replace(spotify_anchor, spotify_anchor + '\n                ' + spotify_code)

          # Scheduler: replace the old Drive-only button with code + original report.
          old_scheduler = '<a class="small-link" href="https://drive.google.com/file/d/1da_NGLsglc-umsylu-yk0n4G3JfCZa_m/view?usp=drive_link" target="_blank" rel="noreferrer">View project ↗</a>'
          scheduler_links = '<a class="small-link" href="https://github.com/pedrohgp02/constraint-aware-task-scheduler" target="_blank" rel="noreferrer">View code ↗</a>\n              <a class="small-link" href="https://drive.google.com/file/d/1da_NGLsglc-umsylu-yk0n4G3JfCZa_m/view?usp=drive_link" target="_blank" rel="noreferrer">Read original report ↗</a>'
          text = text.replace(old_scheduler, scheduler_links)

          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add GitHub links to portfolio projects"
          git push
