name: Update portfolio links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update project and resume links
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          text = text.replace("Pedro-Paiva-CV.pdf", "Curriculum.pdf")

          spotify_old = '''              <div class="project-links">
                <a class="plink primary" href="predicting-spotify-skips.pdf" target="_blank" rel="noreferrer">Read case study ↗</a>
              </div>'''
          spotify_new = '''              <div class="project-links">
                <a class="plink primary" href="predicting-spotify-skips.pdf" target="_blank" rel="noreferrer">Read case study ↗</a>
                <a class="plink" href="https://github.com/pedrohgp02/spotify-skip-prediction" target="_blank" rel="noreferrer">View code ↗</a>
              </div>'''
          text = text.replace(spotify_old, spotify_new)

          scheduler_old = '''            <div class="technical-links">
              <a class="small-link" href="https://drive.google.com/file/d/1da_NGLsglc-umsylu-yk0n4G3JfCZa_m/view?usp=drive_link" target="_blank" rel="noreferrer">View project ↗</a>
            </div>'''
          scheduler_new = '''            <div class="technical-links">
              <a class="small-link" href="https://github.com/pedrohgp02/constraint-aware-task-scheduler" target="_blank" rel="noreferrer">View code ↗</a>
              <a class="small-link" href="https://drive.google.com/file/d/1da_NGLsglc-umsylu-yk0n4G3JfCZa_m/view?usp=drive_link" target="_blank" rel="noreferrer">Read original report ↗</a>
            </div>'''
          text = text.replace(scheduler_old, scheduler_new)

          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix portfolio project and resume links"
          git push
