name: Refine writing visual

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify writing visual
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          override = '''
    /* Writing section: editorial treatment, no faux article card */
    .writing-visual{
      background:linear-gradient(135deg,var(--g-2),var(--g-0));
      min-height:260px;
      align-items:flex-end;
      justify-content:flex-start;
      padding:34px;
      text-align:left;
    }
    .ood-card{
      width:100%;
      background:transparent;
      border:0;
      border-radius:0;
      padding:0;
      box-shadow:none;
      transform:none;
    }
    .ood-small{
      font-size:10px;
      color:var(--faint);
      font-weight:950;
      letter-spacing:.65px;
      text-transform:uppercase;
    }
    .ood-title{
      margin-top:10px;
      font-size:clamp(42px,5vw,62px);
      font-weight:950;
      letter-spacing:-2.4px;
      line-height:.92;
      max-width:420px;
    }
    .ood-note{
      margin-top:18px;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      max-width:330px;
    }
'''

          marker = '</style>'
          if 'Writing section: editorial treatment' not in text:
              text = text.replace(marker, override + '\n' + marker, 1)

          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify writing section visual"
          git push
