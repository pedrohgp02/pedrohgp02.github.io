name: Reorder technical work

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder technical project cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text()

          start_marker = '        <div class="technical-grid">'
          end_marker = '        </div>\n      </section>'

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          cards = re.findall(r'          <article class="technical-card">.*?          </article>', block, flags=re.S)

          order = [
              "Decoding Relationships Between Genes",
              "Constraint-Aware Task Scheduler",
              "Wildfire Spread on a Real Deforestation Frontier",
              "RememberMe: AI Memory Support",
          ]

          by_title = {}
          for card in cards:
              for title in order:
                  if f'<h3>{title}</h3>' in card:
                      by_title[title] = card
                      break

          if len(by_title) != 4:
              raise SystemExit(f"Expected 4 technical cards, found {len(by_title)}")

          new_block = start_marker + "\n" + "\n\n".join(by_title[title] for title in order) + "\n"
          text = text[:start] + new_block + text[end:]
          path.write_text(text)
          PY

      - name: Commit reorder
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reorder technical work cards"
          git push
