name: Swap writing panel

on:
  push:
    paths:
      - ".github/workflows/swap-writing-panel.yml"

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Writing panel
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text()

          old = '''          <a class="writing-visual" href="https://oodnotes.substack.com/" target="_blank" rel="noreferrer" aria-label="Open Out of Distribution on Substack">
            <div class="ood-card">
              <div class="ood-small">Notes from Pedro Paiva</div>
              <div class="ood-title">Out of<br>Distribution</div>
              <div class="ood-note">Prediction and understanding aren’t quite the same thing.</div>
            </div>
          </a>'''

          new = '''          <a class="writing-visual latest-post-visual" href="https://oodnotes.substack.com/p/i-keep-ending-up-out-of-distribution" target="_blank" rel="noreferrer" aria-label="Read I Keep Ending Up Out of Distribution">
            <img src="assets/substack-latest.jpg" alt="Seoul skyline with Namsan Tower" loading="lazy">
            <span class="writing-visual-overlay">Latest from Out of Distribution ↗</span>
          </a>'''

          if old not in s:
              raise SystemExit("Writing panel block not found")
          s = s.replace(old, new, 1)

          marker = "/* Latest Substack feature image */"
          if marker not in s:
              css = '''
    /* Latest Substack feature image */
    .writing-visual.latest-post-visual{position:relative;padding:0;min-height:300px;overflow:hidden;background:var(--g-1)}
    .writing-visual.latest-post-visual img{width:100%;height:100%;min-height:300px;object-fit:cover;object-position:center center;display:block;transition:transform 220ms ease}
    .writing-visual.latest-post-visual:hover img{transform:scale(1.025)}
    .writing-visual-overlay{position:absolute;left:18px;bottom:18px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:11px;font-weight:900;color:rgba(31,36,48,.78);backdrop-filter:blur(7px)}
'''
              s = s.replace("</style>", css + "\n</style>", 1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show latest Substack photo in Writing section"
          git push
