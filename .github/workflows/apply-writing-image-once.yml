name: Apply writing image once

on:
  push:
    paths:
      - ".github/workflows/apply-writing-image-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add latest article image and update Writing section
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          image_b64 = '''[... ELLIPSIZATION ...]'''

          Path("assets").mkdir(exist_ok=True)
          Path("assets/substack-latest.jpg").write_bytes(base64.b64decode(image_b64))

          path = Path("index.html")
          text = path.read_text()

          pattern = re.compile(
              r'<a class="writing-visual(?: latest-post-visual)?" href="[^"]+" target="_blank" rel="noreferrer" aria-label="[^"]+">.*?</a>',
              re.S,
          )
          replacement = '''<a class="writing-visual latest-post-visual" href="https://oodnotes.substack.com/p/i-keep-ending-up-out-of-distribution" target="_blank" rel="noreferrer" aria-label="Read I Keep Ending Up Out of Distribution">
            <img src="assets/substack-latest.jpg" alt="Seoul skyline with Namsan Tower" loading="lazy">
            <span class="writing-visual-overlay">Latest from Out of Distribution ↗</span>
          </a>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Writing visual block not found")

          marker = "/* Latest Substack feature image */"
          if marker not in text:
              css = '''
    /* Latest Substack feature image */
    .writing-visual.latest-post-visual{position:relative;padding:0;min-height:300px;overflow:hidden;background:var(--g-1)}
    .writing-visual.latest-post-visual img{width:100%;height:100%;min-height:300px;object-fit:cover;object-position:center 44%;display:block;transition:transform 220ms ease}
    .writing-visual.latest-post-visual:hover img{transform:scale(1.025)}
    .writing-visual-overlay{position:absolute;left:18px;bottom:18px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:11px;font-weight:900;color:rgba(31,36,48,.78);backdrop-filter:blur(7px)}
'''
              text = text.replace("</style>", css + "\n</style>", 1)

          path.write_text(text)
          PY

      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/substack-latest.jpg
          git commit -m "Use latest Substack photo in Writing section"
          git push
